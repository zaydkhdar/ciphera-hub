<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciphera | Aggregator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #08080a; --surface: #111115; --text-main: #ffffff; --text-muted: #8b8b93; --accent: #8a2be2; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; }
        header { text-align: center; padding: 5rem 2rem 2rem; }
        header h1 { font-size: 3.5rem; font-weight: 800; letter-spacing: -2px; margin-bottom: 0.5rem; }
        header h1 span { color: var(--accent); }
        header p { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 1rem; }
        
        .visitor-counter { display: inline-block; background: rgba(138, 43, 226, 0.1); border: 1px solid var(--accent); padding: 5px 15px; border-radius: 20px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; margin-bottom: 2rem; }

        .search-container { max-width: 600px; margin: 0 auto; display: flex; gap: 10px; }
        .search-container input { flex: 1; padding: 1rem 1.5rem; background: var(--surface); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; font-family: 'JetBrains Mono', monospace; outline: none; }
        .search-container button { padding: 1rem 2rem; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .grid-container { max-width: 1200px; margin: 3rem auto; padding: 0 2rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; }
        .tool-card { background: var(--surface); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 1.5rem; position: relative; display: flex; flex-direction: column; text-decoration: none; color: white; transition: transform 0.3s, border-color 0.3s; }
        .tool-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        
        .source-badge { position: absolute; top: -10px; right: 15px; background: var(--surface); border: 1px solid var(--accent); color: var(--accent); padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; font-family: 'JetBrains Mono', monospace; }
        .tool-header { display: flex; gap: 10px; align-items: center; margin-bottom: 0.5rem; margin-top: 5px; }
        .tool-header img { width: 36px; height: 36px; border-radius: 50%; background: #222; }
        .tool-title { font-size: 1.2rem; font-weight: 600; font-family: 'JetBrains Mono', monospace; line-height: 1.2; }
        .tool-owner { font-size: 0.8rem; color: var(--text-muted); }
        
        .tool-meta { display: flex; gap: 10px; font-size: 0.75rem; color: #aaa; margin-bottom: 1rem; font-family: 'JetBrains Mono', monospace; }
        .meta-tag { background: rgba(255,255,255,0.05); padding: 3px 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }

        .tool-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; flex-grow: 1; line-height: 1.4; }
        
        .score-box { background: rgba(138, 43, 226, 0.1); border-left: 3px solid var(--accent); padding: 12px; margin-bottom: 15px; font-size: 0.85rem; border-radius: 0 8px 8px 0; }
        .score-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-top: 8px; overflow: hidden; }
        .score-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }

        .tool-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 1rem; font-size: 0.85rem; }
        .tool-stats { color: #f1c40f; font-weight: bold; }
        .loader { text-align: center; color: var(--accent); font-family: 'JetBrains Mono', monospace; margin-top: 2rem; display: none; }
    </style>
</head>
<body>

    <header>
        <h1>Ciphera <span>Aggregator</span></h1>
        <p>Live data from GitHub, Hacker News, and Reddit.</p>
        <div class="visitor-counter" id="visitorCount">Loading visits...</div>
        
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search tools, languages, or topics..." onkeypress="handleKeyPress(event)">
            <button onclick="searchAll()">Search</button>
        </div>
    </header>

    <div class="loader" id="loader">Scanning Networks...</div>
    <div class="grid-container" id="toolGrid"></div>

    <script>
        // Visitor Counter API
        fetch('https://api.counterapi.dev/v1/ciphera-hub/visits/up')
            .then(res => res.json())
            .then(data => {
                document.getElementById('visitorCount').innerText = `👁️ ${data.count.toLocaleString()} Developers Reached`;
            }).catch(() => document.getElementById('visitorCount').innerText = `👁️ Connection Established`);

        window.onload = () => searchAll();

        function handleKeyPress(e) { if (e.key === 'Enter') searchAll(); }

        async function searchAll() {
            const query = document.getElementById('searchInput').value || "python";
            const grid = document.getElementById('toolGrid');
            const loader = document.getElementById('loader');
            
            grid.innerHTML = '';
            loader.style.display = 'block';

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}&t=${Date.now()}`);
                const data = await res.json();
                
                loader.style.display = 'none';
                if (!res.ok) throw new Error(data.error || "Failed to load");

                data.forEach(repo => {
                    // Create the link to the internal repo page
                    const repoLink = `repo.html?owner=${repo.owner}&name=${encodeURIComponent(repo.name)}&source=${encodeURIComponent(repo.source)}`;
                    
                    const card = document.createElement('a');
                    card.className = 'tool-card';
                    card.href = repoLink;
                    card.innerHTML = `
                        <div class="source-badge">${repo.source}</div>
                        <div class="tool-header">
                            <img src="${repo.avatar}" alt="Avatar">
                            <div>
                                <div class="tool-title">${repo.name}</div>
                                <div class="tool-owner">@${repo.owner}</div>
                            </div>
                        </div>
                        <div class="tool-meta">
                            <span class="meta-tag">${repo.meta1}</span>
                            <span class="meta-tag">${repo.meta2}</span>
                        </div>
                        <div class="tool-desc">${repo.description}</div>
                        <div class="score-box">
                            <strong style="color: var(--accent);">🔥 Heat Index: ${repo.ai_score}/100</strong>
                            <div class="score-bar-bg"><div class="score-bar-fill" style="width: ${repo.ai_score}%;"></div></div>
                            <span style="color: #ccc; display:block; margin-top:8px;">${repo.ai_reason}</span>
                        </div>
                        <div class="tool-footer">
                            <div class="tool-stats">⭐ ${repo.stars.toLocaleString()} Points/Stars</div>
                            <div style="color: var(--accent); font-weight: bold; font-family: 'JetBrains Mono', monospace;">Enter Workspace →</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                loader.style.display = 'none';
                grid.innerHTML = `<div style="text-align:center; width:100%; color: red; font-family: monospace;">ERROR: ${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
