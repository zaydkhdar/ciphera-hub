<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciphera | Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #08080a; --surface: #111115; --text-main: #ffffff; --text-muted: #8b8b93; --accent: #8a2be2; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; padding-bottom: 4rem; }
        
        nav { padding: 1.5rem 5%; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; background: var(--bg); position: sticky; top: 0; z-index: 100; }
        nav a { color: var(--text-muted); text-decoration: none; font-family: 'JetBrains Mono', monospace; font-weight: bold; }
        nav a:hover { color: var(--accent); }
        .logo { font-size: 1.2rem; font-weight: 800; color: white; letter-spacing: 1px; }
        .logo span { color: var(--accent); }

        .container { max-width: 900px; margin: 3rem auto; padding: 0 2rem; }
        
        .header-info { margin-bottom: 3rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2rem; }
        .source-tag { display: inline-block; background: rgba(138, 43, 226, 0.1); border: 1px solid var(--accent); color: var(--accent); padding: 4px 12px; border-radius: 20px; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; margin-bottom: 1rem; }
        .header-info h1 { font-size: 2.5rem; margin-bottom: 0.5rem; font-family: 'JetBrains Mono', monospace; }
        .credit { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 1rem; }
        .credit strong { color: white; }
        .external-link { display: inline-block; background: var(--accent); color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 1rem; }

        .content-box { background: var(--surface); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 2rem; margin-bottom: 2rem; }
        .content-box h3 { font-family: 'JetBrains Mono', monospace; color: var(--accent); margin-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        
        pre { background: #000; padding: 1.5rem; border-radius: 8px; overflow-x: auto; color: #a9b7c6; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; line-height: 1.5; white-space: pre-wrap; }

        /* Discussion */
        .discussion-input { display: flex; gap: 10px; margin-bottom: 1rem; }
        .discussion-input input { flex: 1; padding: 12px; background: #000; border: 1px solid #333; color: white; border-radius: 6px; outline: none; }
        .discussion-input button { padding: 12px 20px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .comment { background: rgba(255,255,255,0.02); padding: 1rem; border-radius: 6px; margin-bottom: 10px; border-left: 2px solid var(--accent); }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Ciphera <span>Workspace</span></div>
        <a href="index.html">← Back to Search</a>
    </nav>

    <div class="container">
        <div class="header-info" id="headerInfo">
            <p>Loading workspace details...</p>
        </div>

        <div class="content-box">
            <h3>📄 Documentation / Source</h3>
            <div id="readmeContent" style="color: #ccc;">Fetching README...</div>
        </div>

        <div class="content-box">
            <h3>💬 Community Discussion</h3>
            <div class="discussion-input">
                <input type="text" id="commentInput" placeholder="Ask a question or leave feedback...">
                <button onclick="postComment()">Post</button>
            </div>
            <div id="commentsList"></div>
        </div>
    </div>

    <script>
        // 1. Get URL Parameters
        const urlParams = new URLSearchParams(window.location.search);
        const owner = urlParams.get('owner');
        const name = urlParams.get('name');
        const source = urlParams.get('source');

        // 2. Setup Page Header
        document.getElementById('headerInfo').innerHTML = `
            <span class="source-tag">${source}</span>
            <h1>${name}</h1>
            <p class="credit">Created & Maintained by <strong>@${owner}</strong></p>
            <a href="https://github.com/${owner}/${name}" target="_blank" class="external-link">View Source on Original Platform ↗</a>
        `;

        // 3. Fetch README (If GitHub)
        if (source.includes("GitHub")) {
            fetch(`https://api.github.com/repos/${owner}/${name}/readme`, {
                headers: { 'Accept': 'application/vnd.github.v3.raw' }
            })
            .then(res => res.text())
            .then(text => {
                // Basic markdown cleanup for raw display
                document.getElementById('readmeContent').innerHTML = `<pre>${text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</pre>`;
            })
            .catch(() => {
                document.getElementById('readmeContent').innerText = "Could not load README directly. Click 'View Source' to read it on GitHub.";
            });
        } else {
            document.getElementById('readmeContent').innerText = "This is an external discussion thread. Click 'View Source' to read the original post.";
        }

        // 4. LocalStorage Discussion Board
        const repoKey = `ciphera_comments_${owner}_${name}`;
        
        function loadComments() {
            const comments = JSON.parse(localStorage.getItem(repoKey) || "[]");
            const list = document.getElementById('commentsList');
            list.innerHTML = comments.length ? "" : "<p style='color:#666; font-size:0.9rem;'>No comments yet. Start the discussion!</p>";
            
            comments.forEach(c => {
                list.innerHTML += `<div class="comment"><strong>Anon Developer:</strong><br>${c.text}</div>`;
            });
        }

        function postComment() {
            const input = document.getElementById('commentInput');
            if (!input.value.trim()) return;
            
            const comments = JSON.parse(localStorage.getItem(repoKey) || "[]");
            comments.push({ text: input.value.trim(), time: Date.now() });
            localStorage.setItem(repoKey, JSON.stringify(comments));
            
            input.value = '';
            loadComments();
        }

        // Initialize Comments
        loadComments();
    </script>
</body>
</html>
