<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ciphera — Discover Software</title>
<style>
:root {
  color-scheme: dark;
  --bg:#090812; --panel:#131120; --panel2:#1b172b;
  --text:#f5f2ff; --muted:#a59db8; --accent:#a78bfa;
  --border:#29243a; --green:#74e0ae;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font-family:Inter,system-ui,Arial,sans-serif}
header{padding:20px 6%;border-bottom:1px solid var(--border);
display:flex;align-items:center;justify-content:space-between}
.logo{font-size:23px;font-weight:900;letter-spacing:-1px}
.logo span{color:var(--accent)}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
button{cursor:pointer}
nav{display:flex;gap:18px;color:var(--muted);font-size:14px}
nav a:hover{color:white}
main{max-width:1100px;margin:auto;padding:65px 22px}
.hero{text-align:center;margin-bottom:35px}
.eyebrow{color:var(--accent);font-size:12px;letter-spacing:3px}
h1{font-size:clamp(38px,7vw,66px);margin:12px 0;letter-spacing:-3px}
.hero p{color:var(--muted)}
.search{display:flex;gap:10px;max-width:720px;margin:30px auto}
input,select{background:var(--panel);border:1px solid var(--border);
color:white;border-radius:12px;padding:15px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.search input{flex:1;min-width:0}
.primary{background:var(--accent);color:#130d20;border:0;
padding:14px 20px;border-radius:12px;font-weight:800}
.secondary{background:var(--panel2);color:white;border:1px solid var(--border);
padding:11px 15px;border-radius:10px}
.toolbar{display:flex;justify-content:space-between;gap:12px;
align-items:center;flex-wrap:wrap;margin:30px 0 18px}
#status{color:var(--muted);font-size:13px}
#results{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px}
.card{background:var(--panel);border:1px solid var(--border);
border-radius:17px;padding:20px;min-width:0}
.card h3{margin:12px 0 8px;overflow-wrap:anywhere}
.card p{color:var(--muted);font-size:14px;line-height:1.6;min-height:44px}
.tag{font-size:11px;color:var(--accent);background:#29203d;
padding:6px 9px;border-radius:20px}
.meta{font-size:12px;color:var(--muted);margin:15px 0}
.card-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px}
.score{color:var(--green);font-size:12px}
#aiPanel{display:none;background:var(--panel);border:1px solid var(--border);
padding:20px;border-radius:16px;margin:20px 0;white-space:pre-wrap;
line-height:1.7;color:#ded6ef}
footer{text-align:center;color:var(--muted);padding:35px;font-size:12px}
@media(max-width:600px){header{padding:16px 18px}nav{gap:12px}
.search{flex-direction:column}main{padding-top:45px}}
</style>
</head>
<body>
<header>
  <a class="logo" href="/">ciphera<span>.</span></a>
  <nav>
    <a href="#discover">Discover</a>
    <a href="settings.html">Settings</a>
  </nav>
</header>

<main>
  <section class="hero">
    <div class="eyebrow">THE DEVELOPER DISCOVERY ENGINE</div>
    <h1>Find what you're<br>building next.</h1>
    <p>Explore open-source projects and developer discussions.</p>
    <form class="search" id="searchForm">
      <input id="query" placeholder="Try: AI agents, Python, game engine..." required>
      <button class="primary">Explore</button>
    </form>
  </section>

  <section id="discover">
    <div class="toolbar">
      <div id="status">Search for something to get started.</div>
      <div>
        <select id="source">
          <option value="all">All sources</option>
          <option value="GitHub">GitHub</option>
          <option value="Hacker News">Hacker News</option>
        </select>
        <select id="sort">
          <option value="score">Popularity</option>
          <option value="stars">Most stars</option>
          <option value="newest">Recently updated</option>
        </select>
      </div>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="secondary" id="digest">✦ Generate AI research digest</button>
      <button class="secondary" id="clear">Clear results</button>
    </div>

    <div id="aiPanel"></div>
    <div id="results" style="margin-top:18px"></div>
  </section>
</main>

<footer>CIPHERA · Built for curious developers</footer>

<script>
const $ = id => document.getElementById(id);
let currentResults = [];

  try {
  const prefs = JSON.parse(
    localStorage.getItem("ciphera_preferences") || "{}"
  );
  if (["all","GitHub","Hacker News"].includes(prefs.source)) {
    $("source").value = prefs.source;
  }
  if (["score","stars","newest"].includes(prefs.sort)) {
    $("sort").value = prefs.sort;
  }
} catch {}
function make(tag, className, value) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (value !== undefined) el.textContent = value;
  return el;
}

async function askCiphera(prompt) {
  const response = await fetch("/api/ai", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({prompt})
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "AI request failed");
  return data.answer;
}

function render() {
  const root = $("results");
  root.replaceChildren();

  let items = [...currentResults];
  const selected = $("source").value;

  if (selected !== "all") {
    items = items.filter(x => x.source === selected);
  }

  const sort = $("sort").value;
  if (sort === "stars") items.sort((a,b) => b.stars-a.stars);
  if (sort === "score") items.sort((a,b) => b.score-a.score);
  if (sort === "newest") items.sort((a,b) =>
    new Date(b.updated || 0)-new Date(a.updated || 0)
  );

  if (!items.length) {
    root.append(make("p","", "No results to display."));
    return;
  }

  for (const item of items) {
    const card = make("article","card");
    const tag = make("span","tag",item.source);
    const title = make("h3","",item.title);
    const description = make("p","",item.description);
    const meta = make("div","meta",
      item.source === "GitHub"
        ? `${item.language} · ★ ${item.stars.toLocaleString()} · Forks ${item.forks.toLocaleString()}`
        : item.description
    );

    const bottom = make("div","card-bottom");
    const score = make("span","score",`Popularity ${item.score}/100`);
    const link = make("a","secondary","Open project ↗");
    link.href = item.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    if (item.source === "GitHub") {
      const repoLink = make("a","secondary","Ciphera workspace ↗");
      repoLink.href = `repo.html?owner=${encodeURIComponent(item.title.split("/")[0])}&name=${encodeURIComponent(item.title.split("/").slice(1).join("/"))}`;
      bottom.append(score,repoLink);
    } else {
      bottom.append(score,link);
    }

    card.append(tag,title,description,meta,bottom);
    root.append(card);
  }
}

$("searchForm").addEventListener("submit", async event => {
  event.preventDefault();
  const q = $("query").value.trim();
  if (!q) return;

  $("status").textContent = "Searching GitHub and Hacker News…";
  $("results").replaceChildren();
  $("aiPanel").style.display = "none";

  try {
    const response = await fetch("/api/search?q="+encodeURIComponent(q));
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Search failed");

    currentResults = data.results || [];
    $("status").textContent =
      `${data.count} results · GitHub ${data.sources.github ? "✓" : "unavailable"} · Hacker News ${data.sources.hackernews ? "✓" : "unavailable"}`;
    render();
  } catch (error) {
    $("status").textContent = error.message;
  }
});

$("source").addEventListener("change",render);
$("sort").addEventListener("change",render);
$("clear").addEventListener("click",() => {
  currentResults=[];
  $("results").replaceChildren();
  $("aiPanel").style.display="none";
  $("status").textContent="Results cleared.";
});

$("digest").addEventListener("click",async () => {
  if (!currentResults.length) {
    $("status").textContent="Search for projects first.";
    return;
  }

  const panel=$("aiPanel");
  panel.style.display="block";
  panel.textContent="Ciphera Intelligence is researching your results…";

  try {
    const context=currentResults.slice(0,8).map(x => ({
      source:x.source,title:x.title,description:x.description,
      url:x.url,stars:x.stars,language:x.language
    }));

    panel.textContent=await askCiphera(
      "Create a useful developer research digest from this search data. " +
      "Compare the projects, identify patterns, suggest which ones to inspect " +
      "first, and explain limitations. Do not invent details. Data:\n"+
      JSON.stringify(context)
    );
  } catch(error) {
    panel.textContent=error.message;
  }
});
</script>
</body>
  </html>
