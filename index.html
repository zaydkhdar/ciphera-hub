<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciphera | Open Source Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08080a;
            --surface: #111115;
            --text-main: #ffffff;
            --text-muted: #8b8b93;
            --accent: #8a2be2;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
        }
        header { text-align: center; padding: 6rem 2rem 3rem; }
        header h1 { font-size: 3.5rem; font-weight: 800; letter-spacing: -2px; margin-bottom: 1rem; }
        header h1 span { color: var(--accent); }
        header p { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2rem; }
        
        .search-container { max-width: 600px; margin: 0 auto; display: flex; gap: 10px; }
        .search-container input {
            flex: 1; padding: 1rem 1.5rem; background: var(--surface); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; color: white; font-family: 'JetBrains Mono', monospace; outline: none;
        }
        .search-container input:focus { border-color: var(--accent); }
        .search-container button {
            padding: 1rem 2rem; background: var(--accent); color: white; border: none; border-radius: 8px;
            font-weight: bold; cursor: pointer; transition: background 0.3s;
        }
        .search-container button:hover { background: #7a24c9; }

        .grid-container {
            max-width: 1200px; margin: 3rem auto; padding: 0 2rem;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem;
        }
        
        .tool-card {
            background: var(--surface); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px; padding: 1.5rem; transition: transform 0.3s, border-color 0.3s;
            display: flex; flex-direction: column;
        }
        .tool-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .tool-header { display: flex; gap: 10px; align-items: center; margin-bottom: 1rem; }
        .tool-header img { width: 30px; height: 30px; border-radius: 50%; }
        .tool-title { font-size: 1.2rem; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
        .tool-owner { font-size: 0.8rem; color: var(--text-muted); }
        
        .tool-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; flex-grow: 1; }
        
        .tool-footer {
            display: flex; justify-content: space-between; align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05); padding-top: 1rem; font-size: 0.85rem;
        }
        .tool-stats { color: #f1c40f; font-weight: bold; }
        .github-link {
            color: var(--accent); text-decoration: none; font-family: 'JetBrains Mono', monospace; font-weight: bold;
        }
        .github-link:hover { text-decoration: underline; }
        
        .loader { text-align: center; color: var(--accent); font-family: 'JetBrains Mono', monospace; margin-top: 2rem; display: none; }
    </style>
</head>
<body>

    <header>
        <h1>Ciphera <span>Hub</span></h1>
        <p>A live, curated collection of the best open-source tools on GitHub.</p>
        
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search tools (e.g., discord bot, scraper, python)..." onkeypress="handleKeyPress(event)">
            <button onclick="searchGitHub()">Search</button>
        </div>
    </header>

    <div class="loader" id="loader">Connecting to GitHub API...</div>
    <div class="grid-container" id="toolGrid"></div>

    <script>
        // Initial load
        window.onload = () => searchGitHub();

        function handleKeyPress(e) {
            if (e.key === 'Enter') searchGitHub();
        }

        async function searchGitHub() {
            const query = document.getElementById('searchInput').value || "open source";
            const grid = document.getElementById('toolGrid');
            const loader = document.getElementById('loader');
            
            // Show loading state
            grid.innerHTML = '';
            loader.style.display = 'block';

            try {
                // Call our Netlify Serverless Function
                const res = await fetch(`/.netlify/functions/search?q=${encodeURIComponent(query)}`);
                const repos = await res.json();
                
                loader.style.display = 'none';

                if (repos.length === 0) {
                    grid.innerHTML = '<p style="text-align:center; width:100%;">No repositories found.</p>';
                    return;
                }

                // Render the cards
                repos.forEach(repo => {
                    const card = document.createElement('div');
                    card.className = 'tool-card';
                    card.innerHTML = `
                        <div class="tool-header">
                            <img src="${repo.avatar}" alt="Avatar">
                            <div>
                                <div class="tool-title">${repo.name}</div>
                                <div class="tool-owner">@${repo.owner}</div>
                            </div>
                        </div>
                        <div class="tool-desc">${repo.description}</div>
                        <div class="tool-footer">
                            <div class="tool-stats">⭐ ${repo.stars.toLocaleString()}</div>
                            <a href="${repo.url}" target="_blank" class="github-link">View Repo ↗</a>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                
            } catch (err) {
                loader.style.display = 'none';
                grid.innerHTML = '<p style="color:red; text-align:center; width:100%;">Failed to connect to GitHub. Are you running this locally without Netlify Dev?</p>';
            }
        }
    </script>

</body>
      </html>
